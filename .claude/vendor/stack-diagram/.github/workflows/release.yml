name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Claude apps expect stack-diagram/SKILL.md at the top of the zip
      - name: Package skill
        working-directory: skills
        run: zip -r ../stack-diagram.zip stack-diagram

      - name: Create release
        run: gh release create "$GITHUB_REF_NAME" stack-diagram.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
